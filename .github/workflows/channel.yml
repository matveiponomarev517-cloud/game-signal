name: channel
on:
  schedule:
    - cron: "7 6-19 * * *"   # каждый час с 09:07 до 22:07 МСК; бот сам решает, что пора публиковать
  workflow_dispatch:
    inputs:
      force:
        description: "Опубликовать сейчас: news / hot / gem / longread / poll"
        required: false
permissions:
  contents: write
concurrency:
  group: channel
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core
      - run: pip install -r requirements.txt
      - name: Check setup
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python bot.py --check
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - name: Run bot
        run: python bot.py ${FORCE:+--force "$FORCE"}
        env:
          FORCE: ${{ github.event.inputs.force }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_ADMIN_ID: ${{ secrets.TG_ADMIN_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROXY: ${{ secrets.PROXY }}
          CHANNEL_NAME: ${{ vars.CHANNEL_NAME }}
          MAX_PER_DAY: ${{ vars.MAX_PER_DAY }}
          MIN_GAP_MINUTES: ${{ vars.MIN_GAP_MINUTES }}
          POST_HOUR_FROM: ${{ vars.POST_HOUR_FROM }}
          POST_HOUR_TO: ${{ vars.POST_HOUR_TO }}
          SOURCE_IMAGE: ${{ vars.SOURCE_IMAGE }}
          VIDEO: ${{ vars.VIDEO }}
          WEB_SCOUT: ${{ vars.WEB_SCOUT }}
          LONGREADS: ${{ vars.LONGREADS }}
          FACTCHECK: ${{ vars.FACTCHECK }}
          LLM_DAILY_MAX: ${{ vars.LLM_DAILY_MAX }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
      - name: Save state
        if: always()
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -m "state $(date -u +%F-%H)"
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && exit 0; sleep 5; done
          exit 1
